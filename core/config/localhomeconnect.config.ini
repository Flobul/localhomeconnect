[localhomeconnect]
# This file is part of the Jeedom LocalHomeConnect plugin.
# It contains configuration settings for the LocalHomeConnect daemon.

# app_name: The name of the application as it will appear in logs and system processes.
app_name = Jeedom LocalHomeConnect

# daemon_port: The port on which the LocalHomeConnect daemon will listen for incoming connections.
daemon_port = 55043

# discovery_timeout: The timeout in seconds for discovering Home Connect devices on the local network.
discovery_timeout = 8

# reconnect_interval: The interval in seconds to wait before attempting to reconnect to the daemon after a disconnection.
reconnect_interval = 30

# watchdog_interval: The interval in seconds for the watchdog to check the health of the daemon and restart it if necessary.
watchdog_interval = 600

# debug_protocol: Enable or disable protocol debugging. Set to 1 to enable, 0 to disable.
debug_protocol = 0

# callback_verify_tls: Enable or disable TLS verification for callbacks. Set to 1 to enable, 0 to disable.
callback_verify_tls = 1

# homeconnect_username: The Home Connect / SingleKey account used to retrieve the appliance profiles.
homeconnect_username =

# homeconnect_password: The password of that account. Stored with Jeedom encryption.
homeconnect_password =
